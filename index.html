<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lookover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,700;1,6..96,400;1,6..96,500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a fashion-magazine masthead over a quiet hairline grid; color appears only as fabric swatches. */
:root{
  --paper:#fafafb; --surface:#ffffff; --ink:#0a0a0b; --muted:#6b6b73; --line:#e4e4e8; --soft:#f1f1f4;
  --accent:#8c1238; --accent-ink:#ffffff; --ok:#2b6a4c; --ok-soft:#e1efe7; --warn:#8a6100; --warn-soft:#f6ecd2;
  --display:'Bodoni Moda',Didot,'Bodoni 72','Times New Roman',serif;
  --body:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --shadow:0 24px 60px -24px rgba(10,10,20,.18);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0a0a0b; --surface:#131315; --ink:#f5f5f7; --muted:#9b9ba3; --line:#2a2a2f; --soft:#1c1c20;
  --accent:#ef6f93; --accent-ink:#1a0a0d; --ok:#7fc7a1; --ok-soft:#1d3329; --warn:#e2b75a; --warn-soft:#33291a;
  --shadow:0 24px 60px -24px rgba(0,0,0,.7); color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0a0a0b; --surface:#131315; --ink:#f5f5f7; --muted:#9b9ba3; --line:#2a2a2f; --soft:#1c1c20;
  --accent:#ef6f93; --accent-ink:#1a0a0d; --ok:#7fc7a1; --ok-soft:#1d3329; --warn:#e2b75a; --warn-soft:#33291a;
  --shadow:0 24px 60px -24px rgba(0,0,0,.7); color-scheme:dark;}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums lining-nums}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}

/* Masthead */
.mast{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.mast-in{max-width:1200px;margin:0 auto;padding:0 24px;height:68px;display:flex;align-items:center;gap:32px}
.wordmark{font-family:var(--display);font-size:30px;font-weight:500;letter-spacing:-.01em;text-decoration:none;line-height:1}
.wordmark em{font-style:italic;font-weight:400;color:var(--accent)}
.links{display:flex;gap:24px;flex:1}
.links button{background:none;border:0;padding:6px 0;cursor:pointer;color:var(--muted);font-size:14px;border-bottom:1px solid transparent}
.links button[aria-current="page"]{color:var(--ink);border-color:var(--ink)}
.links button:hover{color:var(--ink)}
.role{display:flex;align-items:center;border:1px solid var(--line);padding:3px;border-radius:999px;background:var(--surface)}
.role button{background:none;border:0;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:13px;color:var(--muted)}
.role button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

main{max-width:1200px;margin:0 auto;padding:0 24px 96px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--paper);border:1px solid var(--ink);padding:12px 22px;font-size:14px;font-weight:500;cursor:pointer;letter-spacing:.01em;text-decoration:none;transition:transform .15s ease,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn.line{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.line:hover{border-color:var(--ink)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:8px 14px;font-size:13px}
.textlink{background:none;border:0;padding:0;cursor:pointer;font-size:13px;text-decoration:underline;text-underline-offset:3px;color:var(--muted)}

/* Hero */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:64px;align-items:center;padding:72px 0 80px;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(46px,7.2vw,104px);line-height:.95;font-weight:400;letter-spacing:-.025em;margin:18px 0 28px}
.hero h1 em{font-style:italic;color:var(--accent)}
.hero p.lede{font-size:18px;max-width:46ch;color:var(--muted);margin:0 0 32px}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap}
.hero-facts{display:flex;gap:40px;margin-top:48px;padding-top:24px;border-top:1px solid var(--line);flex-wrap:wrap}
.hero-facts div{display:grid;gap:2px}
.hero-facts b{font-family:var(--display);font-size:30px;font-weight:500}
.hero-facts span{font-size:13px;color:var(--muted)}

/* Sample review (the thesis object) */
.sample{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);position:relative}
.sample-top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.drape{display:flex;height:220px;overflow:hidden}
.drape span{flex:1;transform-origin:top;animation:fall .9s cubic-bezier(.2,.8,.2,1) both}
.drape span:nth-child(2){animation-delay:.08s}.drape span:nth-child(3){animation-delay:.16s}.drape span:nth-child(4){animation-delay:.24s}.drape span:nth-child(5){animation-delay:.32s}
@keyframes fall{from{transform:scaleY(.0)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.drape span,.sheet,.toast{animation:none!important;transition:none!important}}
.sample-body{padding:12px 22px 22px;display:grid;gap:16px}
.verdict{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.score{font-family:var(--display);font-size:64px;line-height:.8;font-weight:500}
.score small{font-size:20px;color:var(--muted);font-weight:400}
.season{text-align:right}
.season b{display:block;font-family:var(--display);font-style:italic;font-size:22px;font-weight:400}
.quote{font-family:var(--display);font-style:italic;font-size:17px;line-height:1.45;margin:0}

/* Swatches */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);padding:4px 10px 4px 4px;font-size:12px;background:var(--surface);border-radius:999px}
.chip i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.chip.avoid{opacity:.75}
.chip.avoid i{background-image:linear-gradient(135deg,transparent 45%,var(--surface) 46%,var(--surface) 54%,transparent 55%)!important}
button.chip{cursor:pointer}
button.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}

/* Section heads */
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding:56px 0 24px;flex-wrap:wrap}
.section-head h2{font-size:clamp(32px,4vw,48px);font-weight:400}
.section-head h2 em{font-style:italic}
.filters{display:flex;gap:20px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:28px}
.filters button{background:none;border:0;padding:10px 0;cursor:pointer;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.filters button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}

/* Stylist cards */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:28px 24px}
.stylist{display:grid;grid-template-rows:auto 1fr;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.portrait{position:relative;aspect-ratio:4/5;overflow:hidden;border:1px solid var(--line);background:var(--soft)}
.portrait img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.stylist:hover .portrait img,.stylist:hover .mono{transform:scale(1.03)}
.mono{position:absolute;inset:0;display:grid;place-items:center;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.mono b{font-family:var(--display);font-style:italic;font-weight:400;font-size:clamp(64px,9vw,112px);color:#fff;letter-spacing:-.02em;line-height:1}
.mono small{position:absolute;left:14px;bottom:12px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.75)}
.avatar{width:72px;height:72px;border-radius:50%;overflow:hidden;flex:none;position:relative;border:1px solid var(--line)}
.avatar .mono b{font-size:28px}
.photo-edit{display:flex;gap:16px;align-items:center}
.tag{position:absolute;left:14px;bottom:14px;background:var(--paper);color:var(--ink);padding:10px 14px 8px;min-width:96px;box-shadow:0 6px 16px -8px rgba(0,0,0,.4)}
.tag::before{content:"";position:absolute;top:6px;left:50%;width:6px;height:6px;border-radius:50%;border:1px solid var(--line);transform:translateX(-50%)}
.tag b{display:block;font-family:var(--display);font-size:28px;font-style:italic;font-weight:500;line-height:1;margin-top:6px}
.tag small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.price-badge{position:absolute;right:14px;top:14px;background:var(--surface);color:var(--ink);font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px}
.price-badge.free{background:var(--ink);color:var(--paper)}
.stylist-info{padding-top:14px;display:grid;gap:4px}
.stylist-info h3{font-size:24px}
.meta{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.meta .dot::before{content:"·";margin-right:10px}
.spec{font-size:13px;color:var(--muted)}

/* Requests */
.list{display:grid;gap:20px}
.req{display:grid;grid-template-columns:220px minmax(0,1fr);background:var(--surface);border:1px solid var(--line)}
.req-photo{position:relative;min-height:260px;background:var(--soft);display:flex}
.req-photo img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.req-photo .stripes{display:flex;flex:1}
.req-photo .stripes span{flex:1}
.req-photo .nophoto{position:absolute;inset:auto 12px 12px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:var(--paper);color:var(--muted);padding:6px 8px;text-align:center}
.req-body{padding:24px 28px;display:grid;gap:14px;align-content:start}
.req-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.req-head h3{font-size:24px}
.ask{font-family:var(--display);font-style:italic;font-size:19px;margin:0;line-height:1.4}
.pill{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;white-space:nowrap}
.pill.pending{background:var(--warn-soft);color:var(--warn)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.fb{border-top:1px solid var(--line);padding-top:18px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:24px}
.fb-score{display:grid;align-content:start;gap:10px}
.fb-main{display:grid;gap:14px}
.fb h4{margin:0 0 6px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fb p{margin:0;max-width:65ch}
.picks{display:grid;border-top:1px solid var(--line)}
.pick{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none}
.pick:hover .pick-store{color:var(--accent)}
.pick-store{font-size:12px;color:var(--muted);white-space:nowrap}
.disclose{font-size:11px;color:var(--muted)}

/* Stylist dashboard */
.studio-head{padding:56px 0 32px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:24px;align-items:flex-end;flex-wrap:wrap}
.studio-head h1{font-size:clamp(36px,5vw,60px);font-weight:400}
.studio-head h1 em{font-style:italic}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line);margin-bottom:40px}
.stat{padding:24px 0 24px 24px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0;padding-left:0}
.stat b{display:block;font-family:var(--display);font-size:44px;font-weight:500;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.queue{display:grid;border-top:1px solid var(--line)}
.qrow{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:20px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.thumb{width:72px;height:90px;background:var(--soft);display:flex;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb span{flex:1}
.qrow h3{font-size:20px}
.qrow .ask{font-size:16px}
.qrow-right{display:flex;align-items:center;gap:14px}

/* Forms */
.formcard{max-width:720px;background:var(--surface);border:1px solid var(--line);padding:36px}
.field{display:grid;gap:6px;margin-bottom:18px}
.field label,.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input,textarea,select{width:100%;padding:12px 14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;border-radius:0}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ink)}
textarea{min-height:96px;resize:vertical}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
input[type=range]{padding:0;accent-color:var(--accent);background:none;border:0}
input[type=file]{background:var(--surface);border-style:dashed;padding:18px}
.hint{font-size:12px;color:var(--muted)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(8,8,12,.5);z-index:40;display:none}
.scrim.open{display:block}
.sheet{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:var(--surface);z-index:41;overflow:auto;transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);border-left:1px solid var(--line)}
.sheet.open{transform:none}
.sheet-in{padding:32px 36px 48px}
.sheet-close{position:sticky;top:0;display:flex;justify-content:flex-end;padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--line);z-index:1}
.sheet h2{font-size:34px;font-weight:400}
.sheet .bio{font-size:16px;max-width:52ch}
.divider{border:0;border-top:1px solid var(--line);margin:28px 0}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}

.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:12px 20px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{padding:64px 0;text-align:center;color:var(--muted)}
.empty h3{font-size:28px;color:var(--ink);margin-bottom:8px}
.cats{display:flex;gap:0;border:1px solid var(--line);margin-bottom:20px;background:var(--surface)}
.cats button{flex:1;background:none;border:0;border-left:1px solid var(--line);padding:18px 20px;text-align:left;cursor:pointer;display:grid;gap:2px}
.cats button:first-child{border-left:0}
.cats button b{font-family:var(--display);font-size:22px;font-weight:500}
.cats button span{font-size:12px;color:var(--muted)}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.cats button[aria-pressed="true"] span{color:color-mix(in srgb,var(--paper) 70%,transparent)}
.kind{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--accent)}
.routine{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.routine ol{margin:0;padding-left:20px;display:grid;gap:4px}
.facts{display:flex;gap:28px;flex-wrap:wrap}
.facts b{display:block;font-family:var(--display);font-style:italic;font-weight:400;font-size:19px}
.note{font-size:12px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}
@media (max-width:620px){.cats{flex-direction:column}.cats button{border-left:0;border-top:1px solid var(--line)}.cats button:first-child{border-top:0}.routine{grid-template-columns:1fr}}
.passport{display:grid;grid-template-columns:320px minmax(0,1fr);background:var(--surface);border:1px solid var(--line)}
.pp-side{border-right:1px solid var(--line);display:grid;align-content:start}
.pp-side .drape{height:260px}
.pp-side-body{padding:22px;display:grid;gap:16px}
.pp-season{font-family:var(--display);font-style:italic;font-size:40px;line-height:1}
.pp-main{padding:28px 32px;display:grid;gap:28px}
.pp-sec{display:grid;grid-template-columns:140px minmax(0,1fr);gap:20px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.pp-sec:last-child{border-bottom:0;padding-bottom:0}
.pp-sec>h3{font-size:22px}
.pp-rows{display:grid;gap:14px}
.pp-rows h4{margin:0 0 6px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.source{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.source.ok{color:var(--ok)}
.mini{background:var(--soft);border:1px solid var(--line);padding:16px 18px;display:grid;gap:10px;margin-bottom:22px}
.mini-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.mini-top b{font-family:var(--display);font-style:italic;font-weight:400;font-size:22px}
.quiz-q{padding:18px 0;border-bottom:1px solid var(--line)}
.quiz-q h3{font-size:19px;margin-bottom:10px;font-family:var(--body);font-weight:600;letter-spacing:0}
.quiz-q .num-q{font-family:var(--display);font-style:italic;color:var(--accent);margin-right:6px}
.adopt{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--soft);padding:12px 14px}
.findcolors{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center;padding:64px 0}
@media (max-width:900px){.passport{grid-template-columns:1fr}.pp-side{border-right:0;border-bottom:1px solid var(--line)}.pp-sec{grid-template-columns:1fr;gap:10px}.findcolors{grid-template-columns:1fr}}
footer{border-top:1px solid var(--line);padding:24px;text-align:center;font-size:12px;color:var(--muted)}

@media (max-width:900px){
  .hero{grid-template-columns:1fr;gap:40px;padding:48px 0 56px}
  .links{display:none}
  .stats{grid-template-columns:1fr 1fr}
  .stat:nth-child(3){border-left:0;padding-left:0}
  .fb{grid-template-columns:1fr}
}
@media (max-width:620px){
  .mast-in{gap:12px;padding:0 16px}
  main{padding:0 16px 72px}
  .wordmark{font-size:24px}
  .req{grid-template-columns:1fr}
  .req-photo{min-height:240px}
  .cols{grid-template-columns:1fr}
  .qrow{grid-template-columns:56px minmax(0,1fr)}
  .thumb{width:56px;height:70px}
  .qrow-right{grid-column:1/-1}
  .formcard{padding:24px}
  .sheet-in{padding:24px 20px 40px}
}
.mobile-links{display:none}
@media (max-width:900px){.mobile-links{display:flex;gap:18px;padding:12px 0 0;overflow-x:auto}.mobile-links button{background:none;border:0;padding:6px 0;font-size:14px;color:var(--muted);border-bottom:1px solid transparent;white-space:nowrap;cursor:pointer}.mobile-links button[aria-current="page"]{color:var(--ink);border-color:var(--ink)}}
</style>
</head>
<body>
<header class="mast">
  <div class="mast-in">
    <a class="wordmark" href="#" id="home" aria-label="Lookover home">Look<em>over</em></a>
    <nav class="links" id="links" aria-label="Main"></nav>
    <div class="role" role="group" aria-label="Prototype view">
      <button id="role-client" data-role="client">Client</button>
      <button id="role-stylist" data-role="stylist">Stylist</button>
    </div>
  </div>
</header>
<main id="app"></main>
<footer>Lookover prototype · payments are simulated and data stays in this browser</footer>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" aria-modal="true" role="dialog" aria-label="Details">
  <div class="sheet-close"><button class="btn line sm" id="sheet-x">Close</button></div>
  <div class="sheet-in" id="sheet-body"></div>
</aside>
<div class="toast" id="toast" role="status"></div>

<script>
const SWATCHES=[['Ink','#1c1c22'],['Optic white','#fbfbf8'],['Ecru','#ece3d2'],['Camel','#b88a5a'],['Chocolate','#5a3a28'],['Rust','#a5482b'],['Mustard','#c99a2e'],['Olive','#6b6b3a'],['Pine','#24493d'],['Teal','#1f6f78'],['Navy','#1f2e55'],['Cornflower','#6f8fd0'],['Plum','#5e2a4d'],['Rose','#d99aa6'],['Dove grey','#b9b7b2'],['True red','#b3202a']];

const SEASONS=['Light Spring','Warm Spring','Clear Spring','Light Summer','Cool Summer','Soft Summer','Soft Autumn','Warm Autumn','Deep Autumn','Deep Winter','Cool Winter','Clear Winter'];

function face(s,label){

}

    ${chips(P.wear)}</div>`;

function computeProfile(a){
  let w={cool:-1.5,warm:1.5,mixed:0,olive:.5}[a.veins]+{silver:-1,gold:1,both:0}[a.metal]+{optic:-1,cream:1,both:0}[a.white];
  const undertone=a.veins==='olive'?'Olive':w>=1?'Warm':w<=-1?'Cool':'Neutral';
  const warm=undertone==='Warm'||(undertone!=='Cool'&&w>0);
  const d=({light:0,medium:1,dark:2}[a.hair]+{light:0,medium:1,dark:2}[a.eyes])/2;
  let season;
  if(warm){season=d<=.5?(a.contrast==='high'?'Clear Spring':'Light Spring'):d>=1.5?'Deep Autumn':a.contrast==='low'?'Soft Autumn':a.contrast==='high'?'Clear Spring':'Warm Autumn'}
  else{season=d<=.5?'Light Summer':d>=1.5?(a.contrast==='high'?'Clear Winter':'Deep Winter'):a.contrast==='low'?'Soft Summer':a.contrast==='high'?'Cool Winter':'Cool Summer'}
  return makeProfile(season,undertone,a.skin,a.concerns||[],'From the color quiz');
}

function readPhoto(input,max=700,portrait=false){
  return new Promise(res=>{const f=input.files?.[0];if(!f)return res(null);
    const img=new Image(),r=new FileReader();
    r.onload=()=>{img.onload=()=>{const c=document.createElement('canvas');
      let sx=0,sy=0,sw=img.width,sh=img.height;
      if(portrait){const want=4/5;if(sw/sh>want){sw=sh*want;sx=(img.width-sw)/2}else{sh=sw/want;sy=(img.height-sh)/4}}
      const k=Math.min(1,max/sw);c.width=sw*k;c.height=sh*k;
      c.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.85))};img.onerror=()=>res(null);img.src=r.result};
    r.onerror=()=>res(null);r.readAsDataURL(f)});
}

function kindFields(k){
  const score=`<div class="field"><label for="fb-score">Score · <span id="sc-v" class="num">7</span> / 10</label><input type="range" id="fb-score" min="1" max="10" value="7"></div>`;
  const season=`<div class="field"><label for="fb-season">Color season</label><select id="fb-season"><option value="">Not assessed</option>${SEASONS.map(s=>`<option>${s}</option>`).join('')}</select></div>`;
  const verdict=(ph,tl,tph)=>`<div class="field"><label for="fb-notes">The verdict</label><textarea id="fb-notes" placeholder="${ph}"></textarea></div>
    <div class="field"><label for="fb-try">${tl}</label><textarea id="fb-try" placeholder="${tph}"></textarea></div>`;
  if(k==='skin')return `<div class="cols"><div class="field"><label for="fb-type">Skin type</label><select id="fb-type">${SKIN_TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div><div></div></div>
    <div class="field"><span class="label">Concerns to focus on</span>${toggles('fb-concerns',CONCERNS)}</div>
    ${verdict('What you see and what is likely causing it','Also try','Habits, timelines, what to stop using')}
    <div class="cols"><div class="field"><label for="fb-am">Morning routine</label><textarea id="fb-am" placeholder="One step per line"></textarea></div>
    <div class="field"><label for="fb-pm">Evening routine</label><textarea id="fb-pm" placeholder="One step per line"></textarea></div></div>
    <p class="note" style="margin-top:0">Clients see a note that this is not medical advice. Refer anything that looks clinical to a dermatologist.</p>`;
  if(k==='makeup')return `${score}<div class="cols"><div class="field"><label for="fb-under">Undertone</label><select id="fb-under">${UNDERTONES.map(t=>`<option>${t}</option>`).join('')}</select></div>${season}</div>
    <div class="field"><span class="label">Lips</span>${swatchPicker('fb-lips',[],SHADES)}</div>
    <div class="field"><span class="label">Cheeks</span>${swatchPicker('fb-cheeks',[],SHADES)}</div>
    <div class="field"><span class="label">Eyes</span>${swatchPicker('fb-eyes',[],SHADES)}</div>
    <div class="field"><span class="label">Skip these shades</span>${swatchPicker('fb-avoid',[],SHADES)}</div>
    ${verdict('What is working and what is not','Try instead','Shade swaps, placement, technique')}`;
  return `${score}${season}
    <div class="field"><span class="label">Wear more</span>${swatchPicker('fb-palette',[])}</div>
    <div class="field"><span class="label">Keep away from the face</span>${swatchPicker('fb-avoid',[])}</div>
    ${verdict('What is working and what is not','Try instead','Specific swaps: pieces, colors, fit, accessories')}`;
}
function sendFeedback(rid){
  const notes=$('#fb-notes').value.trim(),tryInstead=$('#fb-try').value.trim();
  if(!notes){toast('Write your verdict first');$('#fb-notes').focus();return}
  if(!tryInstead){toast('Add at least one suggestion for the client');$('#fb-try').focus();return}
  const products=[0,1,2].map(i=>({name:$('#pn'+i).value.trim(),url:$('#pu'+i).value.trim()}))
    .filter(x=>x.name&&/^https?:\/\/[^\s]+$/i.test(x.url))
    .map(x=>{try{return {...x,store:new URL(x.url).hostname.replace(/^www\./,'')}}catch(e){return null}}).filter(Boolean);
  const r=db.requests.find(x=>x.id===rid);
  const k=kindOf(r);
  if(k==='skin')r.feedback={skinType:$('#fb-type').value,concerns:picked('fb-concerns'),am:$('#fb-am').value.trim(),pm:$('#fb-pm').value.trim(),notes,tryInstead,products};
  else if(k==='makeup')r.feedback={score:+$('#fb-score').value,undertone:$('#fb-under').value,season:$('#fb-season').value,lips:picked('fb-lips'),cheeks:picked('fb-cheeks'),eyes:picked('fb-eyes'),avoid:picked('fb-avoid'),notes,tryInstead,products};
  else r.feedback={score:+$('#fb-score').value,season:$('#fb-season').value,palette:picked('fb-palette'),avoid:picked('fb-avoid'),notes,tryInstead,products};
  r.status='done';save();closeSheet();toast(`Review sent to ${r.client}`);render();
}

/* Delegated clicks */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a');if(!t)return;
  if(t.dataset.stylist)return viewStylist(t.dataset.stylist);
  if(t.dataset.filter){state.filter=t.dataset.filter;render();document.getElementById('roster')?.scrollIntoView({block:'start'});return}
  if(t.dataset.respond)return respond(t.dataset.respond);
  if(t.dataset.cat){state.cat=t.dataset.cat;state.filter='All';render();document.getElementById('roster')?.scrollIntoView({block:'start'});return}
  if(t.dataset.kind){t.parentElement.querySelectorAll('[data-kind]').forEach(b=>b.setAttribute('aria-pressed',b===t));$('#rq-k').value=t.dataset.kind;$('#rq-hint').textContent=KINDS[t.dataset.kind].photo;return}
  if(t.dataset.sw){const g=t.parentElement;const on=t.getAttribute('aria-pressed')!=='true';
    t.setAttribute('aria-pressed',on);return}
  if(t.dataset.quiz)return openQuiz();
  if(t.dataset.qk){t.parentElement.querySelectorAll('[data-qk]').forEach(b=>b.setAttribute('aria-pressed',b===t));quizAns[t.dataset.qk]=t.dataset.qv;return}
  if(t.id==='ep-open')return editProfile();
  if(t.dataset.adopt)return adoptReview(t.dataset.adopt);
  if(t.id==='cta-browse')return document.getElementById('roster').scrollIntoView({behavior:'smooth'});
  if(t.id==='cta-join'){state.role='stylist';return go('join')}
  if(t.id==='save-profile')return saveProfile(!!t.dataset.new);
});
render();
</script>
<style>@media (max-width:760px){.profile-grid{grid-template-columns:1fr!important}}</style>
</body>
