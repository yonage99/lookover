<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lookover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a bright white app with an editorial masthead, a floating dock with a + button, and the user's favorite color as the only accent. */
:root{
  --paper:#ffffff; --surface:#ffffff; --soft:#f5f5f7; --ink:#111114; --muted:#6b6b73; --line:#e7e7ec;
  --accent:#8c1238; --accent-ink:#ffffff; --accent-text:#8c1238; --accent-soft:#f6e8ed;
  --ok:#2b6a4c; --ok-soft:#e3f1e9; --warn:#8a6100; --warn-soft:#f7eed6;
  --display:'Bodoni Moda',Didot,'Bodoni 72','Times New Roman',serif;
  --body:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --shadow:0 18px 50px -22px rgba(17,17,30,.22);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
svg{display:block}
a{color:inherit}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums lining-nums}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}

/* Masthead + Explore menu */
.mast{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.mast-in{max-width:1200px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;gap:20px}
.wordmark{font-family:var(--display);font-size:28px;font-weight:500;letter-spacing:-.01em;text-decoration:none;line-height:1;cursor:pointer}
.wordmark em{font-style:italic;font-weight:400;color:var(--accent-text)}
.explore{position:relative}
.explore-btn{display:flex;align-items:center;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14px;font-weight:500}
.explore-btn[aria-expanded="true"]{background:var(--accent-soft);border-color:transparent;color:var(--accent-text)}
.menu{position:absolute;top:calc(100% + 10px);left:0;width:min(560px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:6px 22px;z-index:40}
.menu h4{grid-column:span 1;margin:6px 0 4px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.menu-col{display:grid;gap:2px;align-content:start}
.menu button{display:flex;align-items:center;gap:10px;background:none;border:0;padding:9px 10px;border-radius:10px;text-align:left;cursor:pointer;font-size:14px}
.menu button:hover{background:var(--soft)}
.menu button i{width:26px;height:26px;border-radius:8px;background:var(--accent-soft);display:grid;place-items:center;font-style:normal;font-size:13px;color:var(--accent-text);flex:none}
.menu .roles{grid-column:1/-1;border-top:1px solid var(--line);padding-top:12px;margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.menu .roles button{padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px}
.menu .roles button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-text);border-color:transparent}
.spacer{flex:1}
.viewing{font-size:12px;font-weight:600;color:var(--accent-text);background:var(--accent-soft);padding:5px 10px;border-radius:999px}
.me-btn .mono b{font-size:15px}
.me-btn{width:38px;height:38px;border-radius:50%;overflow:hidden;border:2px solid var(--accent);padding:0;cursor:pointer;background:var(--soft);position:relative}

/* Dock */
.dock{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:4px;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;padding:6px 8px;box-shadow:var(--shadow)}
.dock button{background:none;border:0;cursor:pointer;display:grid;justify-items:center;gap:2px;padding:6px 14px;border-radius:999px;color:var(--muted);font-size:11px;font-weight:500;min-width:64px}
.dock button svg{width:22px;height:22px}
.dock button[aria-current="page"]{color:var(--accent-text)}
.dock .plus{width:54px;height:54px;min-width:0;padding:0;border-radius:50%;background:var(--accent);color:var(--accent-ink);place-items:center;margin:0 6px;box-shadow:0 10px 24px -10px var(--accent);transition:transform .15s}
.dock .plus:hover{transform:scale(1.06)}
.dock .plus svg{width:26px;height:26px}

main{max-width:1200px;margin:0 auto;padding:0 24px 140px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);padding:12px 22px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
.btn.line{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.line:hover{border-color:var(--ink)}
.btn.soft{background:var(--accent-soft);color:var(--accent-text);border-color:transparent}
.btn.sm{padding:8px 14px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.textlink{background:none;border:0;padding:0;cursor:pointer;font-size:13px;text-decoration:underline;text-underline-offset:3px;color:var(--muted)}

/* Hero */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:64px;align-items:center;padding:64px 0 72px;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(46px,7vw,100px);line-height:.95;font-weight:400;letter-spacing:-.025em;margin:18px 0 26px}
.hero h1 em{font-style:italic;color:var(--accent-text)}
.lede{font-size:18px;max-width:46ch;color:var(--muted);margin:0 0 30px}
.ctas{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.facts-row{display:flex;gap:40px;margin-top:44px;padding-top:22px;border-top:1px solid var(--line);flex-wrap:wrap}
.facts-row div{display:grid;gap:2px}
.facts-row b{font-family:var(--display);font-size:30px;font-weight:500}
.facts-row span{font-size:13px;color:var(--muted)}
.sample{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.sample-art{aspect-ratio:4/3;overflow:hidden}
.sample-art svg{width:100%;height:100%}
.sample-body{padding:20px 22px 22px;display:grid;gap:14px}
.verdict{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.score{font-family:var(--display);font-size:60px;line-height:.8;font-weight:500}
.score small{font-size:20px;color:var(--muted);font-weight:400}
.quote{font-family:var(--display);font-style:italic;font-size:17px;line-height:1.45;margin:0}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);padding:5px 11px;font-size:12.5px;background:var(--surface);border-radius:999px;line-height:1.3}
.chip.c{padding-left:4px}
.chip i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.12);flex:none}
.chip.avoid{opacity:.75}
.chip.avoid i{background-image:linear-gradient(135deg,transparent 45%,#fff 46%,#fff 54%,transparent 55%)!important}
.chip.tag{background:var(--accent-soft);border-color:transparent;color:var(--accent-text);font-weight:500}
button.chip{cursor:pointer}
button.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}

/* Sections */
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding:48px 0 22px;flex-wrap:wrap}
.section-head h2{font-size:clamp(32px,4vw,48px);font-weight:400}
.section-head h2 em{font-style:italic}
.section-head p{margin:6px 0 0;color:var(--muted);max-width:56ch}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:18px}
.cats button{background:var(--soft);border:1px solid transparent;border-radius:14px;padding:14px 16px;text-align:left;cursor:pointer;display:grid;gap:2px}
.cats button b{font-family:var(--display);font-size:20px;font-weight:500}
.cats button span{font-size:12px;color:var(--muted)}
.cats button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.cats button[aria-pressed="true"] b{color:var(--accent-text)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.filters button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:13px;color:var(--muted)}
.filters button[aria-pressed="true"]{color:var(--accent-text);border-color:var(--accent);background:var(--accent-soft)}

/* Pros */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:28px 22px}
.stylist{display:grid;grid-template-rows:auto 1fr;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.portrait{position:relative;aspect-ratio:4/5;overflow:hidden;border-radius:18px;background:var(--soft)}
.portrait img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.stylist:hover .portrait img,.stylist:hover .mono{transform:scale(1.03)}
.mono{position:absolute;inset:0;display:grid;place-items:center;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.mono b{font-family:var(--display);font-style:italic;font-weight:400;font-size:clamp(56px,8vw,100px);color:#fff;letter-spacing:-.02em;line-height:1}
.mono small{position:absolute;left:14px;bottom:12px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.8)}
.avatar{width:44px;height:44px;border-radius:50%;overflow:hidden;flex:none;position:relative;background:var(--soft)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar .mono b{font-size:16px}
.badge{position:absolute;right:12px;top:12px;background:var(--surface);color:var(--ink);font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;display:flex;gap:5px;align-items:center}
.badge.v{background:var(--accent);color:var(--accent-ink)}
.vcheck{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:9px;font-weight:700;vertical-align:1px}
.badge.v .vcheck{background:var(--accent-ink);color:var(--accent)}
.stylist-info{padding-top:12px;display:grid;gap:3px}
.stylist-info h3{font-size:23px}
.meta{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.meta .dot::before{content:"·";margin-right:10px}
.kind{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--accent-text)}

/* Review cards (client) */
.list{display:grid;gap:20px}
.req{display:grid;grid-template-columns:240px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.req-media{position:relative;min-height:280px;background:var(--soft)}
.req-media img,.req-media svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.req-body{padding:24px 28px;display:grid;gap:14px;align-content:start}
.req-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.req-head h3{font-size:24px}
.ask{font-family:var(--display);font-style:italic;font-size:19px;margin:0;line-height:1.4}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.note-box{background:var(--soft);border-radius:12px;padding:10px 12px}
.note-box h4{margin:0 0 2px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.note-box p{margin:0;font-size:14px}
.pill{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;white-space:nowrap}
.pill.pending{background:var(--warn-soft);color:var(--warn)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.fb{border-top:1px solid var(--line);padding-top:18px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:24px}
.fb-score{display:grid;align-content:start;gap:12px}
.fb-main{display:grid;gap:14px}
.fb h4,.h4{margin:0 0 6px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fb p{margin:0;max-width:65ch}
.facts{display:flex;gap:24px;flex-wrap:wrap}
.facts b{display:block;font-family:var(--display);font-style:italic;font-weight:400;font-size:19px}
.routine{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.routine ol{margin:0;padding-left:20px;display:grid;gap:4px}
.picks{display:grid;border-top:1px solid var(--line)}
.pick{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none}
.pick:hover .pick-store{color:var(--accent-text)}
.pick-store{font-size:12px;color:var(--muted);white-space:nowrap}
.disclose{font-size:11px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px;margin:0}
.row-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--soft);padding:12px 14px;border-radius:12px}

/* Community */
.feed{columns:3 300px;column-gap:20px}
.post{break-inside:avoid;margin:0 0 20px;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:grid}
.post-media{position:relative;background:var(--soft)}
.post-media img,.post-media svg{width:100%;height:auto;aspect-ratio:4/5;object-fit:cover}
.post-media .avgtag{position:absolute;left:12px;bottom:12px;background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;display:flex;gap:6px;align-items:baseline}
.post-media .avgtag b{font-family:var(--display);font-size:20px}
.post-body{padding:14px 16px 16px;display:grid;gap:10px}
.who{display:flex;gap:10px;align-items:center}
.who .avatar{width:32px;height:32px}
.who b{font-size:14px}
.rate{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rate button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 0;font-size:12px;font-weight:600;cursor:pointer}
.rate button:hover{border-color:var(--accent)}
.rate button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.comments{display:grid;gap:8px}
.cmt{font-size:13.5px;line-height:1.45}
.cmt b{font-weight:600;margin-right:6px}
.pro-tag{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text);background:var(--accent-soft);padding:2px 6px;border-radius:6px;margin-right:6px}
.cmt-form{display:flex;gap:8px}
.cmt-form input{border-radius:999px;padding:9px 14px}

/* Profile */
.prof-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:28px;align-items:center;padding:44px 0 28px}
.prof-avatar{width:120px;height:120px;border-radius:50%;overflow:hidden;position:relative;border:3px solid var(--accent);cursor:pointer;background:var(--soft);padding:0}
.prof-avatar img{width:100%;height:100%;object-fit:cover}
.prof-avatar .mono b{font-size:44px}
.prof-head h1{font-size:clamp(34px,5vw,54px);font-weight:400}
.fav{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.fav i{width:18px;height:18px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:24px}
.tabs button{background:none;border:0;padding:12px 16px;cursor:pointer;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--accent-text);border-color:var(--accent)}
.board-tools{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.cbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;width:100%}
.bgs{display:flex;gap:6px;align-items:center;margin-left:6px}
.bgdot{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.bgdot[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.collage{position:relative;aspect-ratio:3/4;width:100%;max-width:620px;margin:0 auto;border-radius:22px;overflow:hidden;container-type:inline-size;box-shadow:inset 0 0 0 1px var(--line),var(--shadow);user-select:none;-webkit-user-select:none}
.collage.editing{touch-action:none;box-shadow:inset 0 0 0 2px var(--accent),var(--shadow)}
.ci{position:absolute;touch-action:none}
.collage:not(.editing) .ci{pointer-events:none}
.collage.editing .ci{cursor:grab}
.collage.editing .ci:active{cursor:grabbing}
.ci.sel{outline:2px dashed var(--accent);outline-offset:5px}
.polaroid{background:#fff;padding:5% 5% 15%;box-shadow:0 12px 26px -12px rgba(20,20,40,.45);position:relative}
.polaroid img,.polaroid svg{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;pointer-events:none}
.polaroid .cap{position:absolute;left:0;right:0;bottom:3.5%;text-align:center;font-family:var(--display);font-style:italic;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6%}
.ci-photo .polaroid::before{content:"";position:absolute;top:-5%;left:50%;width:38%;height:9%;transform:translateX(-50%) rotate(-4deg);background:color-mix(in srgb,var(--accent) 28%,rgba(255,255,255,.6));opacity:.85;z-index:1}
.sticker{display:block;line-height:1;text-align:center;filter:drop-shadow(0 4px 6px rgba(0,0,0,.22))}
.ctext{display:block;text-align:center;font-family:var(--display);font-style:italic;line-height:1.05;overflow-wrap:anywhere}
.h-rot,.h-size{display:none;position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--accent);box-shadow:0 2px 6px rgba(0,0,0,.2);z-index:5}
.ci.sel .h-rot,.ci.sel .h-size{display:block}
.h-size{right:-16px;bottom:-16px;cursor:nwse-resize}
.h-rot{left:50%;top:-40px;margin-left:-12px;cursor:grab}
.h-rot::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:14px;background:var(--accent);margin-left:-1px}
.collage-empty{position:absolute;inset:0;display:grid;place-content:center;gap:8px;text-align:center;padding:12%;color:var(--muted);pointer-events:none}
.collage-empty b{font-family:var(--display);font-size:28px;font-weight:400;color:var(--ink)}
.tray{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--soft);padding:10px 12px;border-radius:16px;margin-bottom:18px}
.tray button{width:42px;height:42px;border-radius:12px;border:1px solid transparent;background:var(--surface);font-size:22px;cursor:pointer;display:grid;place-items:center}
.tray button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tray button.locked{opacity:.35;cursor:not-allowed;filter:grayscale(1)}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.presets button{padding:0;border:2px solid transparent;border-radius:14px;overflow:hidden;cursor:pointer;background:none}
.presets button[aria-pressed="true"]{border-color:var(--accent)}
.presets svg{width:100%;height:auto;aspect-ratio:4/5}
.swatch-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.swatch-row button{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}
.swatch-row button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.swatch-row input[type=color]{width:44px;height:38px;padding:2px;border-radius:10px;cursor:pointer}

/* Color passport */
.passport{display:grid;grid-template-columns:300px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.pp-side{border-right:1px solid var(--line);display:grid;align-content:start}
.stripes{display:flex;height:220px}
.stripes span{flex:1}
.pp-side-body{padding:22px;display:grid;gap:16px}
.pp-season{font-family:var(--display);font-style:italic;font-size:38px;line-height:1}
.pp-main{padding:26px 30px;display:grid;gap:24px}
.pp-sec{display:grid;grid-template-columns:130px minmax(0,1fr);gap:20px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.pp-sec:last-child{border-bottom:0;padding-bottom:0}
.pp-sec>h3{font-size:21px}
.pp-rows{display:grid;gap:12px}
.source{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.source.ok{color:var(--ok)}
.mini{background:var(--soft);border-radius:14px;padding:14px 16px;display:grid;gap:8px;margin-bottom:18px}
.mini-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.mini-top b,.mini b.s{font-family:var(--display);font-style:italic;font-weight:400;font-size:21px}
.quiz-q{padding:16px 0;border-bottom:1px solid var(--line)}
.quiz-q h3{font-size:16px;margin-bottom:10px;font-family:var(--body);font-weight:600;letter-spacing:0}
.quiz-q .n{font-family:var(--display);font-style:italic;color:var(--accent-text);margin-right:6px;font-size:18px}

/* Stylist review desk */
.desk-top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:28px 0 18px;flex-wrap:wrap}
.desk-top h1{font-size:clamp(30px,4vw,44px);font-weight:400}
.desk-top h1 em{font-style:italic}
.pager{display:flex;align-items:center;gap:8px}
.pager button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:16px}
.pager button:disabled{opacity:.35;cursor:default}
.progress{height:4px;background:var(--soft);border-radius:4px;overflow:hidden;margin-bottom:22px}
.progress span{display:block;height:100%;background:var(--accent);transition:width .3s}
.desk{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:28px;align-items:start}
.zoomer{position:relative;border-radius:20px;overflow:auto;background:var(--soft);max-height:72vh;cursor:zoom-in;aspect-ratio:4/5}
.zoomer img,.zoomer svg{width:100%;height:100%;object-fit:cover;transition:width .25s}
.zoomer.z{cursor:zoom-out}
.zoomer.z img,.zoomer.z svg{width:220%;height:auto;max-width:none}
.zoom-hint{position:absolute;right:12px;bottom:12px;background:rgba(255,255,255,.94);border-radius:999px;font-size:12px;padding:5px 10px;pointer-events:none}
.desk-left{display:grid;gap:16px;position:sticky;top:84px}
.client-box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:12px}
.desk-form{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px}
.desk-actions{position:sticky;bottom:0;background:var(--surface);padding:14px 0 100px;margin-bottom:-90px;z-index:2;display:flex;gap:10px;justify-content:space-between;border-top:1px solid var(--line);margin-top:8px}

/* Studio + tiers + admin */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}
.stat{background:var(--soft);border-radius:16px;padding:18px 20px}
.stat b{display:block;font-family:var(--display);font-size:40px;font-weight:500;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tier{border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:6px;align-content:start;background:var(--surface)}
.tier.on{border-color:var(--accent);background:var(--accent-soft)}
.tier b{font-family:var(--display);font-size:30px;font-weight:500}
.tier h3{font-family:var(--body);font-size:15px;font-weight:600;letter-spacing:0}
.tier p{margin:0;font-size:13px;color:var(--muted)}
.queue{display:grid;gap:10px}
.qrow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:16px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.thumb{width:64px;height:80px;border-radius:10px;overflow:hidden;background:var(--soft)}
.thumb img,.thumb svg{width:100%;height:100%;object-fit:cover}
.app-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:start;padding:20px;border:1px solid var(--line);border-radius:20px;background:var(--surface)}
.portfolio{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.portfolio div{width:84px;height:104px;border-radius:10px;overflow:hidden;background:var(--soft)}
.portfolio img,.portfolio svg{width:100%;height:100%;object-fit:cover}

/* Forms */
.formcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px}
.field{display:grid;gap:6px;margin-bottom:18px}
.field>label,.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input,textarea,select{width:100%;padding:12px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;border-radius:12px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{min-height:88px;resize:vertical}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
input[type=range]{padding:0;accent-color:var(--accent);border:0}
.pick-photo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick-photo label{display:grid;place-items:center;gap:6px;border:1.5px dashed var(--line);border-radius:16px;padding:22px 10px;cursor:pointer;text-align:center;font-weight:600;font-size:14px;background:var(--soft);text-transform:none;letter-spacing:0;color:var(--ink)}
.pick-photo label:hover{border-color:var(--accent)}
.pick-photo label svg{width:26px;height:26px;color:var(--accent-text)}
.pick-photo input{position:absolute;width:1px;height:1px;opacity:0}
.preview{position:relative;border-radius:16px;overflow:hidden;background:var(--soft);max-height:340px}
.preview img{width:100%;max-height:340px;object-fit:contain}
.preview button{position:absolute;right:10px;top:10px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--soft);border-radius:14px;padding:14px 16px;cursor:pointer}
.switch input{width:auto;accent-color:var(--accent);transform:scale(1.3)}
.switch b{display:block;font-size:14px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(20,20,30,.35);z-index:50;display:none}
.scrim.open{display:block}
.sheet{position:fixed;top:0;right:0;height:100%;width:min(580px,100%);background:var(--surface);z-index:51;overflow:auto;transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);border-radius:24px 0 0 24px;box-shadow:var(--shadow)}
.sheet.open{transform:none}
.sheet-in{padding:28px 34px 48px}
.sheet-close{position:sticky;top:0;display:flex;justify-content:flex-end;padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--line);z-index:3}
.sheet h2{font-size:32px;font-weight:400}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px;flex-wrap:wrap}
.toast{position:fixed;bottom:96px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{padding:56px 0;text-align:center;color:var(--muted)}
.empty h3{font-size:28px;color:var(--ink);margin-bottom:8px}
footer{padding:0 24px 110px;text-align:center;font-size:12px;color:var(--muted)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:900px){
  .hero{grid-template-columns:1fr;gap:36px;padding:40px 0 48px}
  .stats{grid-template-columns:1fr 1fr}
  .fb{grid-template-columns:1fr}
  .passport{grid-template-columns:1fr}.pp-side{border-right:0;border-bottom:1px solid var(--line)}
  .pp-sec{grid-template-columns:1fr;gap:8px}
  .desk{grid-template-columns:1fr}.desk-left{position:static}
  .tiers{grid-template-columns:1fr}
  .prof-head{grid-template-columns:auto minmax(0,1fr)}.prof-head .edit{grid-column:1/-1}
}
@media (max-width:620px){
  .mast-in{padding:0 16px;gap:12px}
  .wordmark{font-size:23px}
  .viewing{display:none}
  main{padding:0 16px 130px}
  .req{grid-template-columns:1fr}.req-media{min-height:300px}
  .cols,.pick-photo{grid-template-columns:1fr 1fr}
  .routine{grid-template-columns:1fr}
  .formcard{padding:22px}
  .sheet{border-radius:0}
  .sheet-in{padding:22px 18px 40px}
  .menu{grid-template-columns:1fr;left:-60px}
  .dock button{min-width:52px;padding:6px 8px}
  .prof-avatar{width:88px;height:88px}
  .app-card{grid-template-columns:1fr}
  .qrow{grid-template-columns:56px minmax(0,1fr)}.qrow>:last-child{grid-column:1/-1}
}
</style>
</head>
<body>
<header class="mast">
  <div class="mast-in">
    <a class="wordmark" id="home" role="button" tabindex="0" aria-label="Lookover home">Look<em>over</em></a>
    <div class="explore">
      <button class="explore-btn" id="explore-btn" aria-expanded="false" aria-controls="menu">Explore
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
      <div class="menu" id="menu" hidden></div>
    </div>
    <span class="spacer"></span>
    <span class="viewing" id="viewing" hidden></span>
    <button class="me-btn" id="me-btn" aria-label="My profile"></button>
  </div>
</header>
<main id="app"></main>
<footer>Lookover · early access · payments are not live yet</footer>
<nav class="dock" id="dock" aria-label="Main"></nav>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" aria-modal="true" role="dialog" aria-label="Details">
  <div class="sheet-close"><button class="btn line sm" id="sheet-x">Close</button></div>
  <div class="sheet-in" id="sheet-body"></div>
</aside>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script>
/* ================= Reference data ================= */
const SWATCHES=[['Ink','#1c1c22'],['Optic white','#fbfbf8'],['Ecru','#ece3d2'],['Camel','#b88a5a'],['Chocolate','#5a3a28'],['Rust','#a5482b'],['Mustard','#c99a2e'],['Olive','#6b6b3a'],['Pine','#24493d'],['Teal','#1f6f78'],['Navy','#1f2e55'],['Cornflower','#6f8fd0'],['Plum','#5e2a4d'],['Rose','#d99aa6'],['Dove grey','#b9b7b2'],['True red','#b3202a']];
const SHADES=[['Nude rose','#c98f86'],['Mauve','#a26a7c'],['Berry','#7d2948'],['Classic red','#b51f2e'],['Brick','#9a3b2b'],['Coral','#e2725b'],['Peach','#f0a98a'],['Soft pink','#e6a3b4'],['Bronze','#9c6a3c'],['Taupe','#8a7466'],['Champagne','#e5cfa5'],['Espresso','#3f2a22'],['Plum shade','#5e2a4d'],['Slate','#5f6670']];
const POLISH=[['Milky white','#f4f1ea'],['Sheer pink','#f1d3d6'],['Ballet nude','#e2c1ae'],['Cherry','#8f1730'],['Fire red','#c8232c'],['Coral pop','#ef6f5b'],['Lilac','#b9a3d6'],['Sage','#a7b59a'],['Navy lacquer','#1f2a4d'],['Oxblood','#4e1420'],['Mocha','#7a5444'],['Gold chrome','#cfa94a'],['Silver chrome','#c7c9cc'],['Black lacquer','#121212']];
const HAIRC=[['Platinum','#e8e0cf'],['Ash blonde','#bfae8f'],['Honey blonde','#c99a52'],['Caramel','#a86b35'],['Copper','#b5532a'],['Auburn','#7f2f1f'],['Chestnut','#6b3b22'],['Chocolate brown','#4a2c1d'],['Ash brown','#5d5148'],['Espresso brown','#2f2019'],['Jet black','#141212'],['Blue black','#1a1d2b']];
const HEX=Object.fromEntries([...SWATCHES,...SHADES,...POLISH,...HAIRC]);
const SEASONS=['Light Spring','Warm Spring','Clear Spring','Light Summer','Cool Summer','Soft Summer','Soft Autumn','Warm Autumn','Deep Autumn','Deep Winter','Cool Winter','Clear Winter'];
const UNDERTONES=['Cool','Neutral','Warm','Olive'];
const SKIN_TYPES=['Dry','Oily','Combination','Normal','Sensitive'];
const CONCERNS=['Breakouts','Dark spots','Redness','Dryness','Fine lines','Texture','Large pores','Dullness'];
const NAIL_SHAPES=['Almond','Oval','Round','Square','Squoval','Coffin','Stiletto'];
const NAIL_LENGTHS=['Short','Medium','Long'];

const AESTHETICS=['Quiet luxury','Minimal','Modest','Streetwear','Coquette','Old money','Y2K','Boho','Clean girl','Soft glam','Edgy','Preppy'];
const STYLE_WORDS=['Modest','Minimal','Colorful','Vintage','Streetwear','Classic','Feminine','Edgy','Sporty','Boho','Preppy','Glam','Thrifted','Neutral tones','Bold prints','Gold jewelry','Silver jewelry'];
const SPECIALTIES=['Color analysis','Modest fashion','Streetwear','Workwear','Menswear','Events & formal','Thrift & budget','Capsule wardrobes','Everyday makeup','Bridal makeup','Acne-prone skin','Sensitive skin','Nail art','Gel & builder','Haircuts','Hair color','Curly hair','Barbering'];
const FAV_COLORS=['#8c1238','#c2185b','#e0607e','#d9742b','#c9a227','#2e7d5b','#1f6f78','#2b59c3','#6a4cc2','#8a6f5a','#5f6670','#111114'];
const STICKERS=['✨','🎀','🌸','💖','⭐','🦋','🍒','👑','🔥','🌈','💅','👗','💄','🕶️','👠','🧸'];
const KINDS={
  outfit:{label:'Outfit',ask:'Rate my outfit',blurb:'Fit, color, what to swap',photo:'Full-length, in daylight'},
  makeup:{label:'Makeup',ask:'Rate my makeup',blurb:'Shades and technique',photo:'Front-facing, in daylight'},
  skin:{label:'Skincare',ask:'Check my skin',blurb:'Skin type and a routine',photo:'Close-up, no makeup'},
  nails:{label:'Nails',ask:'Rate my nails',blurb:'Shape, length, shades',photo:'Hands in daylight'},
  hair:{label:'Hair',ask:'Rate my hair',blurb:'Cuts, color, styling',photo:'Front and side, hair down'}
};
const FAMILY={
  Winter:{wear:['Navy','Ink','Optic white','True red','Plum','Teal'],avoid:['Camel','Mustard','Rust','Ecru'],lips:['Berry','Classic red','Plum shade'],cheeks:['Soft pink','Berry'],eyes:['Slate','Plum shade','Espresso'],nails:['Cherry','Navy lacquer','Silver chrome','Milky white'],hairColors:['Jet black','Blue black','Espresso brown','Ash brown']},
  Summer:{wear:['Navy','Cornflower','Rose','Dove grey','Plum','Teal'],avoid:['Rust','Mustard','Chocolate','Olive'],lips:['Mauve','Soft pink','Berry'],cheeks:['Soft pink','Nude rose'],eyes:['Taupe','Slate','Plum shade'],nails:['Sheer pink','Lilac','Silver chrome','Navy lacquer'],hairColors:['Ash blonde','Platinum','Ash brown']},
  Autumn:{wear:['Camel','Rust','Olive','Chocolate','Mustard','Pine'],avoid:['Optic white','Cornflower','Rose','Ink'],lips:['Brick','Nude rose','Coral'],cheeks:['Peach','Bronze'],eyes:['Bronze','Espresso','Champagne'],nails:['Mocha','Oxblood','Gold chrome','Sage'],hairColors:['Copper','Auburn','Chestnut','Caramel']},
  Spring:{wear:['Ecru','Camel','Teal','Cornflower','True red','Mustard'],avoid:['Ink','Dove grey','Plum','Chocolate'],lips:['Coral','Peach','Classic red'],cheeks:['Peach','Coral'],eyes:['Champagne','Bronze','Taupe'],nails:['Coral pop','Ballet nude','Gold chrome','Fire red'],hairColors:['Honey blonde','Caramel','Copper']}
};
const famOf=season=>Object.keys(FAMILY).find(f=>String(season).endsWith(f))||'Winter';
function makeProfile(season,undertone,skinType,concerns=[],source='From the color quiz',extra={}){
  const f=FAMILY[famOf(season)];
  return {season,undertone,skinType,concerns,wear:[...f.wear],avoid:[...f.avoid],lips:[...f.lips],cheeks:[...f.cheeks],eyes:[...f.eyes],nails:[...f.nails],hairColors:[...f.hairColors],faceShape:null,hairType:null,source,updated:Date.now(),...extra};
}
/* Board presets: inspiration cards drawn in the page */
const PRESETS={
  'Quiet luxury':['outfit',['Camel','Ecru','Chocolate','Dove grey']],'Old money':['outfit',['Navy','Optic white','Camel','Chocolate']],
  'Modest chic':['outfit',['Pine','Ecru','Camel','Chocolate']],'Streetwear':['outfit',['Ink','Olive','Optic white','True red']],
  'Minimal':['outfit',['Optic white','Ink','Dove grey','Ecru']],'Y2K':['outfit',['Lilac','Cornflower','Soft pink','Silver chrome']],
  'Boho':['outfit',['Rust','Mustard','Ecru','Chocolate']],'Coquette':['outfit',['Soft pink','Optic white','Rose','Cherry']],
  'Clean girl':['makeup',['Nude rose','Peach','Champagne','Ballet nude']],'Soft glam':['makeup',['Mauve','Soft pink','Taupe','Champagne']],
  'Chrome nails':['nails',['Silver chrome']],'French tips':['nails',['Milky white']],'Cherry nails':['nails',['Cherry']],
  'Glass skin':['skin',['Sheer pink','Milky white']],'Curtain bangs':['hair',['Chestnut','Caramel','Chocolate brown']],'Copper hair':['hair',['Copper','Auburn','Caramel']]
};

/* ================= Color helpers ================= */
const rgb=h=>{h=String(h).replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16)||0;return [n>>16&255,n>>8&255,n&255]};
const toHex=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>{const x=rgb(a),y=rgb(b);return toHex(x.map((v,i)=>v+(y[i]-v)*t))};
const lum=h=>{const [r,g,b]=rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4});return .2126*r+.7152*g+.0722*b};
function applyTheme(c){
  const r=document.documentElement.style;let t=c,i=0;
  while(lum(t)>.16&&i++<12)t=mix(t,'#000000',.14);
  r.setProperty('--accent',c);r.setProperty('--accent-ink',lum(c)>.42?'#111114':'#ffffff');
  r.setProperty('--accent-text',t);r.setProperty('--accent-soft',mix(c,'#ffffff',.88));
}

/* ================= Illustrations (used when there is no photo) ================= */
function art(kind,names,label){
  const c=(names&&names.length?names:['Dove grey']).map(n=>HEX[n]||n);while(c.length<4)c.push(c[c.length%Math.max(1,c.length)]||'#bbb');
  const st='stroke="rgba(0,0,0,.08)" stroke-width="2"';let g='';
  if(kind==='outfit')g=`<path d="M92 62 L128 48 Q150 64 172 48 L208 62 L236 104 L212 118 L200 100 L200 178 L100 178 L100 100 L88 118 L64 104 Z" fill="${c[0]}" ${st}/>
    <path d="M106 192 L194 192 L204 334 L164 334 L150 236 L136 334 L96 334 Z" fill="${c[1]}" ${st}/>

    <path d="M238 152 q14 -26 28 0" stroke="${c[3]}" stroke-width="5" fill="none"/><rect x="226" y="150" width="52" height="44" rx="8" fill="${c[3]}" ${st}/>`;
  else if(kind==='makeup')g=`<rect x="70" y="172" width="44" height="130" rx="6" fill="#1d1d22"/><rect x="76" y="122" width="32" height="56" fill="#cfae6e"/><path d="M78 124 L78 86 L106 70 L106 124 Z" fill="${c[0]}"/>
    <circle cx="205" cy="118" r="58" fill="#e9e9ee"/><circle cx="205" cy="118" r="44" fill="${c[1]}"/>
    <rect x="148" y="214" width="122" height="96" rx="12" fill="#26262c"/>${[0,1,2,3].map(i=>`<rect x="${160+(i%2)*52}" y="${224+Math.floor(i/2)*40}" width="46" height="34" rx="6" fill="${c[(i+1)%4]}"/>`).join('')}`;
  else if(kind==='nails')g=[0,1,2,3,4].map(i=>{const x=58+i*40,y=120+[34,12,0,14,48][i];return `<rect x="${x-5}" y="${y+40}" width="40" height="${190-([34,12,0,14,48][i])}" rx="20" fill="#e5c2a6"/><path d="M${x} ${y+74} L${x} ${y+26} Q${x} ${y} ${x+15} ${y} Q${x+30} ${y} ${x+30} ${y+26} L${x+30} ${y+74} Z" fill="${c[i%c.length]}" ${st}/><rect x="${x+7}" y="${y+14}" width="5" height="34" rx="3" fill="#fff" opacity=".35"/>`}).join('');
  else if(kind==='hair')g=[0,1,2].map(i=>{const x=105+i*45;return `<path d="M${x} 50 C ${x-50} 130, ${x+50} 210, ${x-6} 330" stroke="${c[i]}" stroke-width="40" fill="none" stroke-linecap="round"/>`}).join('');
  else g=`<rect x="116" y="88" width="26" height="40" rx="10" fill="#26262c"/><rect x="110" y="124" width="38" height="30" fill="#d8d8de"/><rect x="88" y="150" width="82" height="160" rx="16" fill="${c[0]}" ${st}/>

/* ================= Feedback rendering ================= */
function picksBlock(f){
  return f.products?.length?`<div><h4>Shop the picks</h4><div class="picks">${f.products.map(p=>`<a class="pick" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer sponsored"><span>${esc(p.name)}</span><span class="pick-store">${esc(p.store)} ↗</span></a>`).join('')}</div><p class="disclose" style="margin-top:6px">Your stylist may earn a commission on purchases.</p></div>`:'';
}
function feedbackBlock(f,kind){
  const fact=(l,v)=>v?`<div><h4>${l}</h4><b>${esc(v)}</b></div>`:'';
  const head=kind==='skin'?`<div><h4>Skin type</h4><div class="score" style="font-size:32px;font-style:italic;font-weight:400">${esc(f.skinType||'–')}</div></div>`
    :`<div class="score num">${f.score}<small>/10</small></div>`;
  const facts={outfit:fact('Color season',f.season),makeup:fact('Undertone',f.undertone)+fact('Season',f.season),skin:'',nails:fact('Shape',f.shape)+fact('Length',f.length),hair:fact('Face shape',f.faceShape)+fact('Texture',f.hairType)}[kind];
  let body='';
  if(kind==='outfit')body=(f.palette?.length?`<div><h4>Wear more</h4>${chips(f.palette)}</div>`:'')+(f.avoid?.length?`<div><h4>Keep away from your face</h4>${chips(f.avoid,'avoid')}</div>`:'');
  if(kind==='makeup')body=['lips','cheeks','eyes'].map(k=>f[k]?.length?`<div><h4>${k[0].toUpperCase()+k.slice(1)}</h4>${chips(f[k])}</div>`:'').join('')+(f.avoid?.length?`<div><h4>Skip these shades</h4>${chips(f.avoid,'avoid')}</div>`:'');
  if(kind==='nails')body=(f.nailShades?.length?`<div><h4>Shades</h4>${chips(f.nailShades)}</div>`:'')+(f.finishes?.length?`<div><h4>Finish</h4>${tags(f.finishes)}</div>`:'');
  if(kind==='hair')body=(f.cuts?.length?`<div><h4>Cuts to ask for</h4>${tags(f.cuts)}</div>`:'')+(f.hairColors?.length?`<div><h4>Hair colors</h4>${chips(f.hairColors)}</div>`:'');
  if(kind==='skin'){const steps=t=>`<ol>${String(t||'').split('\n').map(x=>x.trim()).filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`;
    body=(f.concerns?.length?`<div><h4>Focus on</h4>${tags(f.concerns)}</div>`:'')+((f.am||f.pm)?`<div class="routine"><div><h4>Morning</h4>${steps(f.am)}</div><div><h4>Evening</h4>${steps(f.pm)}</div></div>`:'')+`<p class="note">General skincare guidance, not medical advice. See a dermatologist for persistent acne, rashes or changing moles.</p>`}
  return `<div class="fb"><div class="fb-score">${head}<div class="facts">${facts}</div></div>
    <div class="fb-main"><div><h4>The verdict</h4><p>${esc(f.notes)}</p></div><div><h4>${kind==='skin'?'Also try':'Try instead'}</h4><p>${esc(f.tryInstead)}</p></div>${body}${picksBlock(f)}</div></div>`;
}
const notesBlock=r=>{const n=[['Must stay',r.keep],['Willing to swap',r.swap],['Aesthetic',r.aesthetic]].filter(x=>x[1]);
  return n.length?`<div class="notes">${n.map(([l,v])=>`<div class="note-box"><h4>${l}</h4><p>${esc(v)}</p></div>`).join('')}</div>`:''};
function profileMini(P,who='Your',hint=''){
  if(!P)return '';
  return `<div class="mini"><div class="mini-top"><span class="eyebrow">${who} color profile</span><span class="source ${P.confirmed?'ok':''}">${P.confirmed?'✓ ':''}${esc(P.source)}</span></div>
    <div><b class="s">${esc(P.season)}</b> <span class="muted">· ${esc(P.undertone)} undertone${P.skinType?` · ${esc(P.skinType)} skin`:''}</span></div>${chips(P.wear)}${hint?`<span class="hint">${hint}</span>`:''}</div>`;
}

  const undertone=a.veins==='olive'?'Olive':w>=1?'Warm':w<=-1?'Cool':'Neutral',warm=undertone==='Warm'||(undertone!=='Cool'&&w>0);
  const d=({light:0,medium:1,dark:2}[a.hair]+{light:0,medium:1,dark:2}[a.eyes])/2;let season;
  if(warm)season=d<=.5?(a.contrast==='high'?'Clear Spring':'Light Spring'):d>=1.5?'Deep Autumn':a.contrast==='low'?'Soft Autumn':a.contrast==='high'?'Clear Spring':'Warm Autumn';
  else season=d<=.5?'Light Summer':d>=1.5?(a.contrast==='high'?'Clear Winter':'Deep Winter'):a.contrast==='low'?'Soft Summer':a.contrast==='high'?'Cool Winter':'Cool Summer';
  return makeProfile(season,undertone,a.skin,a.concerns||[],'From the color quiz',{faceShape:a.face,hairType:a.hairtype});
}

function adoptReview(rid){
  const r=db.requests.find(x=>x.id===rid),f=r.feedback,s=stylist(r.stylistId),P={...(db.profile||makeProfile(f.season||'Cool Summer','Neutral','Normal'))};

  ['lips','cheeks','eyes'].forEach(k=>{if(f[k]?.length)P[k]=f[k]});if(f.skinType)P.skinType=f.skinType;if(f.concerns?.length)P.concerns=f.concerns;
  if(f.nailShades?.length)P.nails=f.nailShades;if(f.hairColors?.length)P.hairColors=f.hairColors;if(f.faceShape)P.faceShape=f.faceShape;if(f.hairType)P.hairType=f.hairType;

}

/* ================= After render: wire per-view behavior ================= */
function afterRender(){
  if(state.view==='feed'){
    const desk=document.querySelector('.desk');if(desk){const r=db.requests.find(x=>x.id===desk.dataset.rid);prefillDesk(r);
      const z=$('#zoomer');z.onclick=()=>z.classList.toggle('z');z.onkeydown=e=>{if(e.key==='Enter')z.classList.toggle('z')};
      $('#q-send').onclick=()=>sendReview(r.id);$('#q-skip').onclick=()=>{state.qi++;render()};
      $('#q-prev').onclick=()=>{state.qi--;render()};$('#q-next').onclick=()=>{state.qi++;render()}}
  }
  if(state.view==='me'){
    $('#avatar-btn').onclick=()=>{if(requireAuth())$('#avatar-input').click()};
    $('#avatar-input').onchange=async e=>{const p=await readPhoto(e.target.files?.[0],500,true);if(p)run(async()=>{const url=await upload(p,'avatar');must(await sb.from('profiles').update({photo_url:url}).eq('id',ME));await load();render()},'Photo updated')};
    $('#edit-me').onclick=()=>{if(requireAuth(editMe))editMe()};
    const cv=$('#collage');
    if(cv&&state.editBoard){
      const c=collageOf(me());
      const select=id=>{state.sel=id;cv.querySelectorAll('.ci').forEach(e=>e.classList.toggle('sel',e.dataset.ci===id));const t=$('#seltools');if(t)t.hidden=!id;
        cv.querySelectorAll('.h-rot,.h-size').forEach(h=>h.remove());const el=id&&cv.querySelector(`[data-ci="${id}"]`);if(el)el.insertAdjacentHTML('beforeend','<span class="h-rot" data-h="rot"></span><span class="h-size" data-h="size"></span>')};
      select(state.sel);
      cv.onpointerdown=e=>{
        const el=e.target.closest('.ci');if(!el){select(null);return}
        e.preventDefault();const it=c.items.find(i=>i.id===el.dataset.ci);if(!it)return;const h=e.target.dataset.h;if(state.sel!==it.id)select(it.id);
        const R=cv.getBoundingClientRect(),cx=R.left+it.x/100*R.width,cy=R.top+it.y/100*R.height;
        const st={x:e.clientX,y:e.clientY,ix:it.x,iy:it.y,w:it.w,r:it.r,d:Math.hypot(e.clientX-cx,e.clientY-cy)||1,a:Math.atan2(e.clientY-cy,e.clientX-cx)};
        const apply=()=>{el.style.left=it.x+'%';el.style.top=it.y+'%';el.style.width=it.w+'%';el.style.transform=`translate(-50%,-50%) rotate(${it.r}deg)`;
          const k=el.querySelector('.sticker,.ctext,.cap');if(k)k.style.fontSize=(it.w*(it.type==='sticker'?.8:it.type==='text'?.15:.085)).toFixed(2)+'cqw'};
        const move=ev=>{if(h==='size')it.w=+clamp(st.w*Math.hypot(ev.clientX-cx,ev.clientY-cy)/st.d,6,95).toFixed(1);
          else if(h==='rot')it.r=Math.round(st.r+(Math.atan2(ev.clientY-cy,ev.clientX-cx)-st.a)*180/Math.PI);
          else{it.x=+clamp(st.ix+(ev.clientX-st.x)/R.width*100,0,100).toFixed(1);it.y=+clamp(st.iy+(ev.clientY-st.y)/R.height*100,0,100).toFixed(1)}apply()};
        const up=()=>{cv.removeEventListener('pointermove',move);cv.removeEventListener('pointerup',up);cv.removeEventListener('pointercancel',up);queueSave()};
        try{cv.setPointerCapture(e.pointerId)}catch(_){}
        cv.addEventListener('pointermove',move);cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
      };
    }
  }
  document.querySelectorAll('[data-cform]').forEach(f=>f.onsubmit=e=>{e.preventDefault();const t=f.elements.c.value;if(!t.trim())return;addComment(f.dataset.cform,t);render();const el=document.getElementById('post-'+f.dataset.cform);el&&el.scrollIntoView({block:'center'})});
  const as=$('#apply-v');if(as)as.onclick=applyVerification;
}

/* ================= Global click handling ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a[role=button]');if(!t)return;const d=t.dataset;
  if(d.go){setMenu(false);closeSheet();return go(d.go)}
  if(d.role){state.role=d.role;setMenu(false);return go(DOCK[d.role][0][0])}
  if(t.id==='plus'||t.id==='plus2'||t.id==='plus3'){return openComposer()}
  if(d.compose){setMenu(false);return openComposer({kind:d.compose,stylistId:d.to})}
  if(d.quiz){setMenu(false);return openQuiz()}
  if(d.signup){setMenu(false);return openAuth('signup')}
  if(d.stylist)return viewStylist(d.stylist);
  if(d.cat){state.cat=d.cat;render();document.getElementById('roster')?.scrollIntoView({block:'start'});return}
  if(d.filter){state.filter=d.filter;render();document.getElementById('roster')?.scrollIntoView({block:'start'});return}
  if(d.comcat){state.comCat=d.comcat;return render()}
  if(d.tab){state.meTab=d.tab;return render()}
  if(d.sticker){if(addItem({type:'sticker',e:d.sticker,w:14,r:Math.round(Math.random()*20-10)})){queueSave();render()}return}
  if(d.cb){const c=collageOf(me()),it=c.items.find(i=>i.id===state.sel);
    if(d.cb==='edit'){if(!requireAuth())return;state.editBoard=true;state.sel=null;return render()}
    if(d.cb==='done'){state.editBoard=false;state.sel=null;clearTimeout(saveTimer);saveMe().then(()=>toast('Collage saved'));return render()}
    if(d.cb==='photo'||d.cb==='inspo')return addToBoard();
    if(d.cb==='text')return addTextSheet();
    if(d.cb==='bg'){c.bg=d.bg;queueSave();return render()}
    if(!it)return;
    if(d.cb==='front')it.z=topZ(c);
    if(d.cb==='back'){const lo=c.items.reduce((m,i)=>Math.min(m,i.z),Infinity);c.items.forEach(i=>i.z+=1);it.z=Math.max(1,lo)}
    if(d.cb==='del'){c.items=c.items.filter(i=>i.id!==it.id);state.sel=null}
    queueSave();return render()}
  if(d.rate){if(!requireAuth())return;const pid=d.rate,n=+d.n,had=db.posts.find(x=>x.id===pid)?.ratings?.[ME];
    return run(async()=>{must(had?await sb.from('ratings').update({score:n}).eq('post_id',pid).eq('user_id',ME):await sb.from('ratings').insert({post_id:pid,user_id:ME,score:n}));await load();render();document.getElementById('post-'+pid)?.scrollIntoView({block:'center'})})}
  if(d.allc){const p=db.posts.find(x=>x.id===d.allc);openSheet(`<h2 style="margin-bottom:16px">Comments</h2><div class="comments">${p.comments.map(c=>`<div class="cmt">${c.pro?'<span class="pro-tag">Stylist</span>':''}<b>${esc(c.by===ME?'You':personOf(c.by).name)}</b>${esc(c.text)}</div>`).join('')}</div>`);return}
  if(d.share){const r=db.requests.find(x=>x.id===d.share);return run(async()=>{const post=must(await sb.from('posts').insert({author_id:ME,kind:r.kind,caption:r.question,aesthetic:r.aesthetic,photo_url:r.photo,request_id:r.id}).select().single());
    must(await sb.from('requests').update({post_id:post.id}).eq('id',r.id));await load();render()},'Posted to the community')}
  if(d.stars){return run(async()=>{must(await sb.from('requests').update({client_stars:+d.n}).eq('id',d.stars));await load();render()},'Thanks for rating your stylist')}
  if(d.adopt)return adoptReview(d.adopt);
  if(d.ckind){snapshotCompose();state.compose.kind=d.ckind;return renderComposer()}
  if(d.aes){$('#cp-aes').value=d.aes;return}
  if(d.qk){t.parentElement.querySelectorAll('[data-qk]').forEach(b=>b.setAttribute('aria-pressed',b===t));quizAns[d.qk]=d.qv;return}
  if(d.sw!==undefined&&!t.closest('#em-fav')){t.setAttribute('aria-pressed',t.getAttribute('aria-pressed')!=='true');return}
  if(t.id==='ep-open')return editColors();
  if(d.approve||d.decline){const id=d.approve||d.decline,ok=!!d.approve;return run(async()=>{must(await sb.rpc('review_application',{app_id:id,approve:ok}));await load();render()},ok?'Stylist verified':'Application declined')}
  if(t.id==='save-stylist'){const v=readStylistForm();if(!v)return;return run(async()=>{must(await sb.from('stylists').update(v).eq('id',ME));await load();render()},'Profile saved')}
  if(t.id==='create-stylist'){if(!requireAuth())return;const v=readStylistForm();if(!v)return;return run(async()=>{must(await sb.from('stylists').insert({id:ME,...v}));await load();state.role='stylist';go('studio')},'Welcome! You can start reviewing for free.')}
  if(t.id==='logout'){setMenu(false);return logout()}
  if(t.id==='login'){setMenu(false);return openAuth('login')}
});
render();
refresh();
sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'||ev==='TOKEN_REFRESHED')return;});
</script>
